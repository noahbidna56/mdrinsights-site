<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — mdr_insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav>
    <a class="brand" href="index.html">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 4h10v11.5l6.5 15A4 4 0 0 1 27.9 36H12.1a4 4 0 0 1-3.6-5.5l6.5-15V4Z" stroke="#1F1330" stroke-width="1.6"/>
        <path d="M14 20c6 2 8-1 12 1" stroke="#3D5AFE" stroke-width="1.4"/>
        <path d="M20 15c-1-4 2-6 5-6-1 4-2 6-5 6Z" fill="#2F9E68"/>
      </svg>
      mdr_insights
    </a>
    <div class="nav-links">
      <a href="what-we-do.html" class="nav-btn">What we do</a>
      <a href="how-it-works.html" class="nav-btn">How it works</a>
      <a href="contact.html" class="btn btn-primary">Request a walkthrough</a>
    </div>
  </nav>
</header>
<section id="contact" class="section section-tint page-top">
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">GET IN TOUCH</p>
      <h2>See what full program value looks like for you.</h2>
    </div>
    <div class="contact-single">
      <form>
        <div class="form-row">
          <div>
            <label for="fname">First name</label>
            <input id="fname" type="text" placeholder="Jordan">
          </div>
          <div>
            <label for="lname">Last name</label>
            <input id="lname" type="text" placeholder="Reyes">
          </div>
        </div>
        <div>
          <label for="org">Health system</label>
          <input id="org" type="text" placeholder="Your health system or GPO">
        </div>
        <div class="form-row">
          <div>
            <label for="email">Work email</label>
            <input id="email" type="email" placeholder="you@organization.org">
          </div>
          <div>
            <label for="role">Role</label>
            <select id="role">
              <option>Supply chain</option>
              <option>Sustainability</option>
              <option>Value analysis</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div>
          <label for="msg">Tell us more</label>
          <textarea id="msg" placeholder="Tell us about what you want to accomplish with your reprocessing program."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="justify-self:start;">Request a walkthrough</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <a class="brand" href="index.html">mdr_insights</a>
    <div class="foot-links">
      <a href="what-we-do.html">What we do</a>
      <a href="how-it-works.html">How it works</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="copy">&copy; 2026 MDR_Insights</div>
  </div>
</footer>

</body>
</html>
